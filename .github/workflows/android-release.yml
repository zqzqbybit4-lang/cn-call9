name: Android Release Split APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref/branch to build'
        required: true
        default: 'jules-14399745368418415334-28cffc24'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Release Split APK
        run: |
          cd mobile
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cn-call9-android-release-split
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
