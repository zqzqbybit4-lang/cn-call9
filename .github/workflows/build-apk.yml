name: Build Android Release ARM64 Split APK

on:
  push:
    branches: [ "jules-audit-5361230264265879278" ]
  pull_request:
    branches: [ "jules-audit-5361230264265879278" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Get Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build APK Release ARM64 Split
        run: |
          cd mobile
          flutter build apk --release --split-per-abi --target-platform=android-arm64

      - name: Upload ARM64 Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cn-call-arm64-release
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
